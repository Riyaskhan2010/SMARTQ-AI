services:
  # ── Backend ──────────────────────────────────────────────────────
  - type: web
    name: smartq-ai-backend
    env: node
    region: singapore
    rootDir: backend
    buildCommand: npm install && cp prisma/schema.prod.prisma prisma/schema.prisma && npx prisma generate && npx prisma db push --accept-data-loss && node prisma/seed.js
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DEMO_MODE
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartq-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://smartq-ai-frontend.onrender.com

  # ── Frontend ─────────────────────────────────────────────────────
  - type: web
    name: smartq-ai-frontend
    env: static
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://smartq-ai-backend.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://smartq-ai-backend.onrender.com

databases:
  - name: smartq-ai-db
    plan: free
    region: singapore
